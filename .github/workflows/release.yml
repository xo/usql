name: Release
on: push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  APP: usql
  VER: ${{ github.ref_name }}
  GO_VERSION: stable

jobs:
  build_for_linux:
    name: Build for Linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm, arm64]
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get -qq update
          sudo apt-get install -y \
            build-essential \
            qemu-user \
            gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libstdc++6-armhf-cross \
            libstdc++6-arm64-cross \
            libc6-dev-armhf-cross \
            libc6-dev-arm64-cross \
            file
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build ${{ matrix.arch }}
        run: |
          ./build.sh -v $VER -a ${{ matrix.arch }}
      - name: Build ${{ matrix.arch }} (static)
        if: matrix.arch != 'arm'
        run: |
          ./build.sh -v $VER -a ${{ matrix.arch }} -s
      - name: Archive artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-linux-${{ matrix.arch }}
          path: build/linux/**/*
          if-no-files-found: error

  build_for_macos:
    name: Build for macOS
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Install build dependencies
        run: |
          brew install coreutils
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build ${{ matrix.arch }}
        run: |
          ./build.sh -v $VER -a ${{ matrix.arch }}
      - name: Archive artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-darwin-${{ matrix.arch }}
          path: build/darwin/**/*
          if-no-files-found: error

  build_for_macos_universal:
    name: Build for macOS (universal)
    needs:
      - build_for_macos
    runs-on: macos-latest
    steps:
      - name: Install build dependencies
        run: |
          brew install coreutils
      - name: Download artifacts
        uses: actions/download-artifact@v8
      - name: Build universal
        run: |
          if [ "$VER" = "master" ]; then
            VER=0.0.0-dev
          fi

          export WORKDIR=$PWD/build/darwin/universal/$VER
          mkdir -p $WORKDIR

          gtar -jxvf dist-darwin-amd64/*/*/*.tar.bz2 -C $WORKDIR $APP
          gtar -jxvf dist-darwin-amd64/*/*/*.tar.bz2 -C $WORKDIR LICENSE
          mv $WORKDIR/$APP $WORKDIR/$APP-amd64

          gtar -jxvf dist-darwin-arm64/*/*/*.tar.bz2 -C $WORKDIR $APP
          mv $WORKDIR/$APP $WORKDIR/$APP-arm64

          file $WORKDIR/$APP-{amd64,arm64}

          lipo -create -output $WORKDIR/$APP $WORKDIR/$APP-amd64 $WORKDIR/$APP-arm64
          chmod +x $WORKDIR/$APP
          file $WORKDIR/$APP

          rm $WORKDIR/$APP-{amd64,arm64}

          sudo /usr/sbin/purge

          gtar -C $WORKDIR -cjf $WORKDIR/$APP-${VER#v}-darwin-universal.tar.bz2 $APP LICENSE
          ls -alh $WORKDIR/*
          sha256sum $WORKDIR/*
      - name: Archive artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-darwin-universal
          path: build/darwin/**/*
          if-no-files-found: error

  build_for_windows:
    name: Build for Windows
    runs-on: windows-latest
    steps:
      - name: Install build dependencies
        run: choco install zip
      # The duckdb driver links prebuilt static archives that were built by
      # MinGW-Builds GCC 14.2.0 for x86_64, UCRT, posix-seh. Linking needs a
      # toolchain matching all three: the MSVCRT gcc fails on __stdio_common_*
      # because the archives want UCRT, and a newer UCRT gcc fails on
      # __emutls_v._ZSt11__once_call because its libstdc++ no longer uses
      # emulated TLS there. MSYS2 ships a newer gcc in both environments, so
      # this pins the version with winget instead.
      - name: Install MinGW toolchain for duckdb
        shell: pwsh
        run: |
          winget install --id BrechtSanders.WinLibs.POSIX.UCRT.LLVM --exact --silent `
            --accept-package-agreements --accept-source-agreements
          $bin = Join-Path $env:LOCALAPPDATA 'Microsoft\WinGet\Packages\BrechtSanders.WinLibs.POSIX.UCRT.LLVM_Microsoft.Winget.Source_8wekyb3d8bbwe\mingw64\bin'
          if (-not (Test-Path $bin)) { throw "the toolchain is not at $bin" }
          # First on PATH, so it wins over any other gcc on the image.
          "$bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Check the toolchain
        shell: bash
        run: |
          gcc --version
          gcc -dumpmachine
          # The duckdb archives were built by MinGW-Builds GCC 14.2.0 for UCRT
          # with posix-seh. A mismatch on either axis only appears at link,
          # with undefined symbols that name neither as the cause, so describe
          # the toolchain here where it can be read plainly.
          #
          # This reports and never fails. The build that follows is the real
          # test, and a wrong guess here must not be able to block a release.
          #
          # _UCRT comes from the UCRT headers rather than from the compiler,
          # so a header has to be included before asking for it. Do not test
          # gcc -dumpmachine either: it reports x86_64-w64-mingw32 for the
          # MSVCRT and UCRT builds alike, because the target triple does not
          # carry the runtime.
          ucrt=no
          if echo '#include <stdio.h>' | gcc -E -dM - 2>/dev/null | grep -q '^#define _UCRT'; then
            ucrt=yes
          fi
          major=$(gcc -dumpversion 2>/dev/null | cut -d. -f1)
          echo "runtime: UCRT=$ucrt  gcc major: $major"
          if [ "$ucrt" != "yes" ]; then
            echo "warning: this gcc targets MSVCRT, and the duckdb archives need UCRT." >&2
            echo "         expect undefined references to __stdio_common_vsnprintf_s." >&2
          fi
          if [ "$major" != "14" ]; then
            echo "warning: this gcc is $major, and the duckdb archives need 14." >&2
            echo "         a newer libstdc++ drops emulated TLS, so expect an" >&2
            echo "         undefined reference to __emutls_v._ZSt11__once_call." >&2
          fi
      - name: Build amd64
        shell: bash
        run: |
          ./build.sh -v $VER
      - name: Archive artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-windows
          path: build/windows/**/*
          if-no-files-found: error

  draft_release:
    name: Draft Release
    needs:
      - build_for_linux
      - build_for_macos
      - build_for_macos_universal
      - build_for_windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # The whole history, because the notes are built from the commits
          # between this tag and the one before it.
          fetch-depth: 0
      - name: Download artifacts
        uses: actions/download-artifact@v8
      - name: Extract artifacts
        run: |
          mkdir /tmp/scan
          mkdir scan
          for i in $(find dist-* -name \*.tar.bz2); do
            name=$(basename $i|cut -d- -f1)
            ver=$(sed -e 's/\.tar\.bz2$//' <<< $(basename $i)|cut -d- -f2-)
            echo "extracting $i ($name $ver)"
            tar -C /tmp/scan -jv -f $i -x $name
            hash=$(sha256sum /tmp/scan/$name|awk '{print $1}')
            mv /tmp/scan/$name ./scan/$name-$ver-${hash:0:8}
          done
          for i in $(find dist-* -name \*.zip); do
            name=$(basename $i|cut -d- -f1)
            ver=$(sed -e 's/\.zip$//' <<< $(basename $i)|cut -d- -f2-)
            echo "extracting $i ($name $ver)"
            unzip -d /tmp/scan $i $name.exe
            hash=$(sha256sum /tmp/scan/$name.exe|awk '{print $1}')
            mv /tmp/scan/$name.exe ./scan/$name-$ver-${hash:0:8}.exe
          done
          file ./scan/*
          sha256sum ./scan/*
      - name: Submit to VirusTotal
        id: virustotal
        uses: crazy-max/ghaction-virustotal@v5
        with:
          vt_api_key: ${{ secrets.VIRUSTOTAL_API_KEY }}
          request_rate: 4
          files: |
            ./scan/*
      - name: Build Changelog
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Commit subjects in this repository are written as "area: what
          # changed", so grouping by the area gives a changelog that reads by
          # subject instead of a flat list of pull requests.
          prev=$(git describe --tags --abbrev=0 "${VER}^" 2>/dev/null || true)
          if [ -z "$prev" ]; then
            range="${VER}"
            echo "## Changes" > notes.md
          else
            range="${prev}..${VER}"
            echo "## Changes since ${prev}" > notes.md
          fi
          echo >> notes.md
          git log --no-merges --format='%s' "$range" | sort -u > subjects.txt
          # Every subject with an area prefix, grouped under that area.
          grep -E '^[a-z0-9][a-z0-9/._-]*: ' subjects.txt \
            | sed -E 's/^([^:]+): */\1\t/' \
            | sort -f \
            | awk -F'\t' '
                $1 != last { printf "\n### %s\n\n", $1; last = $1 }
                { printf "- %s\n", $2 }
              ' >> notes.md
          # Everything else, so nothing is silently dropped.
          if grep -qvE '^[a-z0-9][a-z0-9/._-]*: ' subjects.txt; then
            printf '\n### Other\n\n' >> notes.md
            grep -vE '^[a-z0-9][a-z0-9/._-]*: ' subjects.txt | sed 's/^/- /' >> notes.md
          fi
          echo "--- generated notes ---"
          cat notes.md
      - name: Generate Release Notes
        id: generate_release_notes
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: ${{ env.APP }} ${{ env.VER }}
          draft: true
          body_path: notes.md
          # The commit log above replaces the automatic list of pull requests.
          generate_release_notes: false
          files: |
            dist-*/*/*/*.tar.bz2
            dist-*/*/*/*.zip
      - name: Add VirusTotal Info to Release Notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # github api url
          url=https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/${{ steps.generate_release_notes.outputs.id }}
          echo "url: $url"

          # get release notes
          release=$(
            curl \
              -s \
              -L \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              $url
          )
          tag_name=$(jq -r .tag_name <<< "$release")
          target_commitish=$(jq -r .target_commitish <<< "$release")
          body=$(jq -r .body <<< "$release")

          echo "tag_name: $tag_name target_commitish: $target_commitish"

          # append virustotal details to release notes
          nl=$'\n'
          body+="$nl$nl[VirusTotal](https://www.virustotal.com) analysis:$nl"
          while read -r -d, line; do
            name=$(sed -e 's/^\.\/scan\/\([^=]\+\)=.*/\1/' <<< "$line")
            vturl=$(sed -e 's/.*=\(https.*\)/\1/' <<< "$line")
            body+="* [$name]($vturl)$nl"
          done <<< "${{ steps.virustotal.outputs.analysis }},"

          echo -e "body:\n$body"

          # update release notes
          export tag_name target_commitish body
          curl \
            -s \
            -L \
            -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --variable '%tag_name' \
            --varable '%target_commitish' \
            --variable '%body' \
            --expand-data '{"tag_name": "{{tag_name:json}}", "body": "{{body:trim:json}}"}' \
            $url
